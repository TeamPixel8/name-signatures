<!DOCTYPE html>
<html>
  <head>
    <link href="styles/main.css" rel="stylesheet">
  </head>

  <body>
    <div class="container">
    <table class="title">
      <tbody>
        <tr>
          <td class="logo"><img src="https://user-images.githubusercontent.com/97190576/148313025-c8fa4a2e-2d5d-46d4-be12-2c7f11855f04.png" width="92" alt="Pixel8" style="width: 92px; max-width: 92px;"></td>
          <td class="title-text"><h1 style="font-family: Arial, Helvetica, sans-serif;">&nbsp;Signature Generator</h1></td>
        </tr>
      </tbody>
    </table>

    <div class="input-form" style="font-family: Arial, Helvetica, sans-serif;">
      <form>
        <label for="fname">Name</label><br>
        <input type="text" id="fname" name="fname" placeholder="Use Full Name"><br>

        <label for="jtitle">Job Title:</label><br>
        <input type="text" id="jtitle" name="jtitle" placeholder="Designer, Developer etc."><br>

        <label for="pnumber">Phone Number:</label><br>
        <input type="text" id="pnumber" name="pnumber" placeholder="Follow Format: (000) 000-0000"><br>

        <label for="email">Email:</label><br>
        <input type="text" id="email" name="email" placeholder="Use lowercase: name@pixel8.ca"><br>
      </form>

      <button type="button" onclick="updateSignature()">Replace</button>
      <button type="button" class="copy-button" onclick="copySignature(false)">Copy Signature</button>
      <button type="button" class="apple-mail-button" id="apple_mail_copy" onclick="copySignature(true)" disabled>Preparing Apple Mail…</button>
      <span id="copy_status" class="copy-status" role="status" aria-live="polite"></span>

      <a class="toggle" href="dark-index.html">Dark Mode</a>

    </div>

    <!-- Generated Signature -->
    <div class="gen-sign" id="signature">
      <table width="400" cellpadding="0" cellspacing="0" border="0" style="width: 400px; border-collapse: collapse; border-spacing: 0; font-family: Arial, Helvetica, sans-serif; color: #000001;">
        <tr>
         <td width="64" valign="top" style="width: 64px; vertical-align: top; padding: 0;">
           <img data-apple-image="logo" src="https://user-images.githubusercontent.com/97190576/148271286-f24f3186-a4c4-402b-ba58-e104f2598a9e.png" width="64" height="64" alt="Pixel8" style="display: block; width: 64px; height: 64px; border: 0;">
         </td>

        <td valign="top" style="padding: 0 0 0 15px; vertical-align: top;">
          <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; border-spacing: 0; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 17px; color: #000001;">

    <!-- Name + Title -->
            <tr>
              <td style="padding: 0 0 4px 0; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 17px;">
                  <span id="first_name" style="font-size: 14px; line-height: 17px; color: #112a3e; font-weight: 600;">Ella Anderson</span>
                  <span> | </span>
                  <span id="job_title">Talent Recruiter</span>
              </td>
            </tr>

    <!-- Contact Links -->
      <tr>
        <td style="padding: 1px 0; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 17px;">
            <span style="font-weight: 600; color: #112a3e;">Phone:</span>
            <a href="tel:(416) 677-1853" id="phone_number" style="color: #000001; font-family: Arial, Helvetica, sans-serif; text-decoration: underline;">(416) 677-1853</a>
        </td>
      </tr>

      <tr>
        <td style="padding: 1px 0; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 17px;">
            <span style="font-weight: 600; color: #112a3e;">Email:</span>
              <a href="mailto:ella@pixel8.ca" id="e_mail" style="color: #000001; font-family: Arial, Helvetica, sans-serif; text-decoration: underline;">ella@pixel8.ca</a>
        </td>
      </tr>

      <tr>
        <td style="padding: 1px 0; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 17px;">
            <span style="font-weight: 600; color: #112a3e;">Website:</span>
            <a href="https://pixel8.ca" style="color: #000001; font-family: Arial, Helvetica, sans-serif; text-decoration: underline;">www.pixel8.ca</a>
        </td>
      </tr>

    <!-- Social Links -->
      <tr>
        <td style="padding: 0;">
          <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; border-spacing: 0;">
            <tr>
              <td style="padding: 0 4px 0 0;">
                <a href="https://instagram.com/pixel8.ca/"><img data-apple-image="instagram" width="21" height="21" src="https://user-images.githubusercontent.com/97190576/148271291-969da33c-a8db-4345-9289-2eb4e31f7833.png" alt="Instagram" style="display: block; width: 21px; height: 21px; border: 0;"></a>
              </td>

              <td style="padding: 0 4px 0 0;">
                <a href="https://ca.linkedin.com/company/pixel8-ca"><img data-apple-image="linkedin" width="21" height="21" src="https://user-images.githubusercontent.com/97190576/148271292-dac05eb2-162c-46d8-9404-e355efb13c04.png" alt="LinkedIn" style="display: block; width: 21px; height: 21px; border: 0;"></a>
              </td>

              <td style="padding: 0 4px 0 0;">
                <a href="https://facebook.com/pixel8.ca/"><img data-apple-image="facebook" width="21" height="21" src="https://user-images.githubusercontent.com/97190576/148271288-81feddbc-516c-4042-b6ed-e359d55576da.png" alt="Facebook" style="display: block; width: 21px; height: 21px; border: 0;"></a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
          </td>
        </tr>
      </table>
    </div>
  </div>

    <script>
      function updateSignature() {
        var fn = document.getElementById("fname").value;
        var jt = document.getElementById("jtitle").value;
        var pn = document.getElementById("pnumber").value;
        var em = document.getElementById("email").value;
        document.getElementById("first_name").textContent = fn;
        document.getElementById("job_title").textContent = jt;
        document.getElementById("phone_number").textContent = pn;
        document.getElementById("phone_number").href="tel:" + pn;
        document.getElementById("e_mail").textContent = em;
        document.getElementById("e_mail").href="mailto:" + em;
      }

      var appleMailImages = {};

      function copySignature(forAppleMail) {
        if (["fname", "jtitle", "pnumber", "email"].some(function (id) {
          return document.getElementById(id).value;
        })) {
          updateSignature();
        }

        var signature = document.getElementById("signature");
        var status = document.getElementById("copy_status");
        var copy = signature.cloneNode(true);
        var plainText = signature.innerText.trim();
        var helper = document.createElement("textarea");
        var copiedHtml = false;

        if (forAppleMail && Object.keys(appleMailImages).length !== 4) {
          status.textContent = "Apple Mail images are still loading. Please try again.";
          return;
        }

        copy.querySelectorAll("img[data-apple-image]").forEach(function (image) {
          var key = image.getAttribute("data-apple-image");
          if (forAppleMail) image.src = appleMailImages[key];
          image.removeAttribute("data-apple-image");
        });
        copy.querySelectorAll("[id]").forEach(function (element) {
          element.removeAttribute("id");
        });

        var html = copy.innerHTML.trim();
        helper.value = plainText;
        helper.setAttribute("readonly", "");
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        helper.style.pointerEvents = "none";
        document.body.appendChild(helper);
        helper.select();
        helper.setSelectionRange(0, helper.value.length);

        var handleCopy = function (event) {
          if (!event.clipboardData) return;
          event.clipboardData.setData("text/html", html);
          event.clipboardData.setData("text/plain", plainText);
          event.preventDefault();
          copiedHtml = true;
        };

        document.addEventListener("copy", handleCopy);

        try {
          if (document.execCommand("copy") && copiedHtml) {
            status.textContent = "Copied!";
            return;
          }

          if (navigator.clipboard && window.ClipboardItem) {
            navigator.clipboard.write([new ClipboardItem({
              "text/html": new Blob([html], { type: "text/html" }),
              "text/plain": new Blob([plainText], { type: "text/plain" })
            })]).then(function () {
              status.textContent = "Copied!";
            }).catch(function () {
              status.textContent = "Copy failed. Please try again.";
            });
          } else {
            status.textContent = "Copy failed. Please try again.";
          }
        } catch (error) {
          status.textContent = "Copy failed. Please try again.";
        } finally {
          document.removeEventListener("copy", handleCopy);
          document.body.removeChild(helper);
        }
      }

      function imageToDataUrl(url) {
        return fetch(url).then(function (response) {
          if (!response.ok) throw new Error("Image failed to load");
          return response.blob();
        }).then(function (blob) {
          return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onload = function () { resolve(reader.result); };
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });
        });
      }

      Promise.all([
        imageToDataUrl("images/signature/logo.png").then(function (data) { appleMailImages.logo = data; }),
        imageToDataUrl("images/signature/instagram.png").then(function (data) { appleMailImages.instagram = data; }),
        imageToDataUrl("images/signature/linkedin.png").then(function (data) { appleMailImages.linkedin = data; }),
        imageToDataUrl("images/signature/facebook.png").then(function (data) { appleMailImages.facebook = data; })
      ]).then(function () {
        var button = document.getElementById("apple_mail_copy");
        button.disabled = false;
        button.textContent = "Copy for Apple Mail";
      }).catch(function () {
        document.getElementById("copy_status").textContent = "Apple Mail images could not be prepared.";
      });
    </script>
  </body>
</html>
