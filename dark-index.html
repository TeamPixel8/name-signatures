<!DOCTYPE html>
<html>
  <head>
    <link href="styles/dark-main.css" rel="stylesheet">

  <body>
    <div class="container">
    <table class="title">
      <tbody>

          <td class="logo"><img src="https://user-images.githubusercontent.com/97190576/148338064-05a59996-c175-466a-97cd-3bac9e34dd91.png" width="92" alt="Pixel8" style="width: 92px; max-width: 92px;"></td>
          <td class="title-text"><h1 style="font-family: Arial, Helvetica, sans-serif;">&nbsp;Signature Generator</h1></td>

      </tbody>

    <div class="input-form" style="font-family: Arial, Helvetica, sans-serif;">
      <form>
        <label for="fname">Name</label><br>

        <label for="jtitle">Job Title:</label><br>
        <input type="text" id="jtitle" name="jtitle" placeholder="Designer, Developer etc."><br>

        <label for="pnumber">Phone Number:</label><br>
        <input type="text" id="pnumber" name="pnumber" placeholder="Follow Format: (000) 000-0000"><br>

        <label for="email">Email:</label><br>
        <input type="text" id="email" name="email" placeholder="Use lowercase: name@pixel8.ca"><br>
      </form>

      <button type="button" onclick="updateSignature()">Replace</button>
      <button type="button" class="copy-button" onclick="copySignature()">Copy Signature</button>
      <span id="copy_status" class="copy-status" role="status" aria-live="polite"></span>

      <a class="toggle" href="index.html">Light Mode</a>
    </div>

    <!-- Generated Signature -->
    <div class="gen-sign" id="signature">

         <td width="64" valign="top" style="width: 64px; vertical-align: top; padding: 0;">

         </td>

        <td valign="top" style="padding: 0 0 0 15px; vertical-align: top;">
          <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; border-spacing: 0; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 17px; color: #fdfdfd;">

    <!-- Name + Title -->
            <tr>
              <td style="padding: 0 0 4px 0; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 17px;">
                  <span id="first_name" style="font-size: 14px; line-height: 17px; color: #fdfdfd; font-weight: 600;">Ella Anderson</span>
                  <span style="color: #fdfdfd;"> | </span>
                  <span id="job_title" style="color: #fdfdfd;">Talent Recruiter</span>
              </td>
            </tr>

    <!-- Contact Links -->
      <tr>
        <td style="padding: 1px 0; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 17px;">
            <span style="font-weight: 600; color: #fdfdfd;">Phone:</span>
            <a href="tel:(416) 677-1853" id="phone_number" style="color: #fdfdfd; font-family: Arial, Helvetica, sans-serif; text-decoration: underline;">(416) 677-1853</a>
        </td>
      </tr>

      <tr>
        <td style="padding: 1px 0; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 17px;">
            <span style="font-weight: 600; color: #fdfdfd;">Email:</span>
              <a href="mailto:ella@pixel8.ca" id="e_mail" style="color: #fdfdfd; font-family: Arial, Helvetica, sans-serif; text-decoration: underline;">ella@pixel8.ca</a>
        </td>
      </tr>

      <tr>
        <td style="padding: 1px 0; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 17px;">
            <span style="font-weight: 600; color: #fdfdfd;">Website:</span>
            <a href="https://pixel8.ca" style="color: #fdfdfd; font-family: Arial, Helvetica, sans-serif; text-decoration: underline;">www.pixel8.ca</a>
        </td>
      </tr>

    <!-- Social Links -->
      <tr>
        <td style="padding: 0;">
          <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; border-spacing: 0;">
            <tr>
              <td style="padding: 0 4px 0 0;">
                <a href="https://instagram.com/pixel8.ca/"><img width="21" height="21" src="https://user-images.githubusercontent.com/97190576/148271291-969da33c-a8db-4345-9289-2eb4e31f7833.png" alt="Instagram" style="display: block; width: 21px; height: 21px; border: 0;"></a>
              </td>

              <td style="padding: 0 4px 0 0;">
                <a href="https://ca.linkedin.com/company/pixel8-ca"><img width="21" height="21" src="https://user-images.githubusercontent.com/97190576/148271292-dac05eb2-162c-46d8-9404-e355efb13c04.png" alt="LinkedIn" style="display: block; width: 21px; height: 21px; border: 0;"></a>
              </td>

              <td style="padding: 0 4px 0 0;">
                <a href="https://facebook.com/pixel8.ca/"><img width="21" height="21" src="https://user-images.githubusercontent.com/97190576/148271288-81feddbc-516c-4042-b6ed-e359d55576da.png" alt="Facebook" style="display: block; width: 21px; height: 21px; border: 0;"></a>

            </tr>

        </td>
      </tr>
    </table>
          </td>
        </tr>
      </table>
    </div>
  </div>

    <script>
      function updateSignature() {
        var fn = document.getElementById("fname").value;
        var jt = document.getElementById("jtitle").value;
        var pn = document.getElementById("pnumber").value;
        var em = document.getElementById("email").value;
        document.getElementById("first_name").textContent = fn;
        document.getElementById("job_title").textContent = jt;
        document.getElementById("phone_number").textContent = pn;
        document.getElementById("phone_number").href="tel:" + pn;
        document.getElementById("e_mail").textContent = em;
        document.getElementById("e_mail").href="mailto:" + em;
      }

      async function copySignature() {
        var signature = document.getElementById("signature");
        var status = document.getElementById("copy_status");
        var html = signature.innerHTML.trim();
        var plainText = signature.innerText.trim();

        try {
          if (navigator.clipboard && window.ClipboardItem) {
            await navigator.clipboard.write([new ClipboardItem({
              "text/html": new Blob([html], { type: "text/html" }),
              "text/plain": new Blob([plainText], { type: "text/plain" })
            })]);
          } else {
            var handleCopy = function (event) {
              event.clipboardData.setData("text/html", html);
              event.clipboardData.setData("text/plain", plainText);
              event.preventDefault();
            };
            document.addEventListener("copy", handleCopy, { once: true });
            if (!document.execCommand("copy")) throw new Error("Copy command failed");
          }
          status.textContent = "Copied!";
        } catch (error) {
          status.textContent = "Copy failed. Please try again.";
        }
      }
    </script>
  </body>
</html>
